{% if lead_confirmed %}
<script id="rs-lead-event">
(function () {
  function sendLead() {
    if (localStorage.getItem('rs_meta_consent') !== 'accepted') return;

    if (typeof window.fbq === 'function') {
      window.fbq('track', 'Lead');
    } else {
      setTimeout(sendLead, 250);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', sendLead);
  } else {
    sendLead();
  }
})();
</script>
